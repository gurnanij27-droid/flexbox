<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 540px;
            border: 1px solid black;
            width: 100%;
            background-color: antiquewhite;
        }
        .header{
            height: 20%;
            border: 1px solid black;
            width: 100%;
            background-color: aqua;
        }
        .middle{
            height: 60%;
            border: 1px solid black;
            width: 100%;
            display: flex;
            background-color: blanchedalmond;
        }
        .footer{
            height: 20%;
            border: 1px solid black;
            width: 100%;
            background-color: blue;
        }
        .left{
            height: 100%;
            width: 20%;
            border: 1px solid black;
            background-color: bisque;
        }
        .right{
            height: 100%;
            width: 80%;
            border: 1px solid black;
            background-color: blueviolet;

        }
        .top{
            height: 50%;
            width: 100%;
        }
        .bottom{
            height: 50%;
            width: 100%;
            border: 1px solid black;
            display: flex;
            background-color: brown;
        }
        .bottom-left{
            height: 100%;
            width: 50%;
            background-color: teal;
        }
        .bottom-right{
            height: 100%;
            width: 50%;
            background-color: greenyellow;
        }
        *{
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1 align="center">Flex Box</h1>
    <div class="con">
    <div class="header"></div>
    <div class="middle">
        <div class="left"></div>
        <div class="right">
            <div class="top"></div>
            <div class="bottom">
                <div class="bottom-left"></div>
                <div class="bottom-right"></div>
            </div>
            </div>
        </div>
    <div class="footer"></div>
    </div>
</body>
</html>
